{{- if .Values.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "synthetic-monitor.fullname" . }}-dashboard
  labels:
    {{- include "synthetic-monitor.labels" . | nindent 4 }}
    {{- with .Values.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  synthetic-monitor.json: |-
    {{- .Files.Get "dashboards/synthetic-monitor.json" | nindent 4 }}
{{- end }}
