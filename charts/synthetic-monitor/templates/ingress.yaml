{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "synthetic-monitor.fullname" . }}
  labels:
    {{- include "synthetic-monitor.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls.secretName }}
  tls:
    - hosts:
        - {{ $.Values.ingress.host | quote }}
      secretName: {{ . }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required when the ingress is enabled" .Values.ingress.host | quote }}
      http:
        # An allowlist: only the status page and heartbeats are public.
        # /metrics, /healthz and /readyz stay inside the cluster, and an
        # endpoint added later stays private until it is listed here.
        paths:
          {{- range list (list "/" "Exact") (list "/api/status" "Exact") (list "/static/" "Prefix") (list "/heartbeat/" "Prefix") }}
          - path: {{ index . 0 }}
            pathType: {{ index . 1 }}
            backend:
              service:
                name: {{ include "synthetic-monitor.fullname" $ }}
                port:
                  name: http
          {{- end }}
{{- end }}
