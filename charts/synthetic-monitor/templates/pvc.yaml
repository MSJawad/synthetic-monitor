apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "synthetic-monitor.fullname" . }}
  labels:
    {{- include "synthetic-monitor.labels" . | nindent 4 }}
  annotations:
    # helm uninstall leaves the history behind; installing the same release
    # again picks it up.
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
