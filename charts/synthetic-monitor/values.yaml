image:
  repository: ghcr.io/msjawad/synthetic-monitor
  # Required: the commit SHA of the image to run. CI tags every image it
  # pushes from main with its commit SHA; there is no "latest".
  tag: ""
  pullPolicy: IfNotPresent

# Pull secrets for a private registry, e.g. [{name: ghcr}].
imagePullSecrets: []

# The checks to run, in the format of examples/checks.yaml. Edits reach the
# running pod without a restart: the kubelet updates the mounted ConfigMap,
# usually within a minute, and the monitor applies it on its next poll.
checks: []

# Name of an existing Secret whose keys all become environment variables:
# NTFY_URL and NTFY_TOKEN for alerts, HEARTBEAT_TOKEN for heartbeat checks,
# WATCHDOG_URL for the monitor's own dead man's switch, and any variable the
# checks refer to as ${NAME}. Use a Secret for the monitor alone, since every
# key in it is exposed to the monitor. Without one, notifications are only
# logged and heartbeat checks are rejected.
existingSecret: ""

monitor:
  logLevel: info
  maxConcurrentProbes: 64
  # Must cover the longest SLO window among the checks.
  historyRetentionDays: 35
  configPollInterval: 5s
  # How long probes in flight get to finish when the pod stops. The pod's
  # termination grace period is set 10 seconds longer.
  shutdownTimeoutSeconds: 30

# Holds probe history and alert state, so a restart neither forgets an
# incident nor resets the SLOs.
persistence:
  # Empty uses the cluster's default storage class (local-path on k3s).
  storageClassName: ""
  size: 1Gi

service:
  port: 80

# Exposes the status page and the heartbeat endpoint, and nothing else.
ingress:
  enabled: false
  # Empty uses the cluster's default ingress class (Traefik on k3s).
  className: ""
  # Required when enabled, e.g. status.203.0.113.7.sslip.io.
  host: ""
  # How the certificate is issued depends on the cluster, e.g.
  # cert-manager.io/cluster-issuer: letsencrypt
  annotations: {}
  tls:
    # The Secret holding the certificate. Empty leaves TLS to the ingress
    # controller's own configuration.
    secretName: ""

# Prometheus Operator scrape config. kube-prometheus-stack only selects
# ServiceMonitors labelled with its release name, e.g.
# labels: {release: kube-prometheus-stack}.
serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

# The Grafana dashboard as a ConfigMap, for Grafana's dashboard sidecar
# (enabled in kube-prometheus-stack), which loads ConfigMaps with this label.
grafanaDashboard:
  enabled: false
  labels:
    grafana_dashboard: "1"

# No CPU limit: CPU throttling would delay probes and show up as latency of
# the targets.
resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
