name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Helm is downloaded at the version used locally and checked against its
  # published hash, rather than taken from whatever the runner image ships.
  HELM_VERSION: v4.3.1
  HELM_SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b

# Actions are pinned to commit SHAs because tags can be moved to point at
# different code; the comment records the version each SHA belongs to.
jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # -shuffle surfaces tests that only pass in a particular order.
      - run: go test -race -shuffle=on -count=1 ./...

  chart:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Helm
        run: |
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/helm.tar.gz" "https://get.helm.sh/helm-$HELM_VERSION-linux-amd64.tar.gz"
          echo "$HELM_SHA256  $RUNNER_TEMP/helm.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP/bin" --strip-components=1 linux-amd64/helm
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Lint the Helm chart
        run: helm lint --strict charts/synthetic-monitor --set image.tag=ci
      # Renders every template, with the example checks as values and the
      # optional resources on, and checks the dashboard is valid JSON.
      - name: Render the Helm chart
        run: |
          helm template synthetic-monitor charts/synthetic-monitor -f examples/checks.yaml \
            --set image.tag=ci --set serviceMonitor.enabled=true --set grafanaDashboard.enabled=true \
            --set ingress.enabled=true --set ingress.host=status.example.com --set ingress.tls.secretName=status-tls > /dev/null
          jq empty charts/synthetic-monitor/dashboards/synthetic-monitor.json

  image:
    needs: [lint, test, chart]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/msjawad/synthetic-monitor
      # Pull requests only check that the image builds; pushes to main
      # publish it, tagged with the commit SHA.
      PUSH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create a BuildKit builder
        # The default builder can only build for one platform at a time; a
        # docker-container builder builds both into one multi-platform image.
        # Its BuildKit image is pinned for the same reason the actions are.
        run: >-
          docker buildx create --use --driver docker-container
          --driver-opt image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - name: Install Helm
        run: |
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/helm.tar.gz" "https://get.helm.sh/helm-$HELM_VERSION-linux-amd64.tar.gz"
          echo "$HELM_SHA256  $RUNNER_TEMP/helm.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP/bin" --strip-components=1 linux-amd64/helm
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the image for arm64 and amd64
        run: >-
          docker buildx build .
          --platform linux/arm64,linux/amd64
          --build-arg VERSION="$GITHUB_SHA"
          --tag "$IMAGE:$GITHUB_SHA"
          --output type=image,push=$PUSH
      - name: Check the registry has both platforms
        if: env.PUSH == 'true'
        # Reads back what the registry stores. Build attestations are listed
        # with platform unknown/unknown, so they are left out.
        run: |
          platforms=$(docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" --format '{{json .Manifest}}' \
            | jq -r '[.manifests[].platform | select(.os != "unknown") | "\(.os)/\(.architecture)"] | sort | join(",")')
          echo "Published platforms: $platforms"
          test "$platforms" = "linux/amd64,linux/arm64"
      - name: Package the Helm chart
        # Version 0.1.<run number> rises with every run, and Flux deploys the
        # highest. The commit, as appVersion, is the tag of the image the
        # chart runs; the render checks that it is.
        run: |
          helm package charts/synthetic-monitor --version "0.1.$GITHUB_RUN_NUMBER" --app-version "$GITHUB_SHA" --destination "$RUNNER_TEMP"
          helm template synthetic-monitor "$RUNNER_TEMP/synthetic-monitor-0.1.$GITHUB_RUN_NUMBER.tgz" -f examples/checks.yaml \
            | grep -qF "image: \"$IMAGE:$GITHUB_SHA\""
      - name: Publish the Helm chart
        # After the image, so a published chart never names an image that
        # is not in the registry yet.
        if: env.PUSH == 'true'
        run: |
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "$RUNNER_TEMP/synthetic-monitor-0.1.$GITHUB_RUN_NUMBER.tgz" oci://ghcr.io/msjawad/charts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    # Flux deploys from inside the cluster, so CI holds no cluster
    # credentials. This job waits until the public status page reports this
    # commit, so a rollout that fails, and is rolled back, fails CI with a
    # clear message. It runs once the STATUS_URL repository variable names
    # a deployment to wait for.
    needs: [image]
    if: github.event_name == 'push' && vars.STATUS_URL != ''
    runs-on: ubuntu-26.04
    steps:
      - name: Wait for the status page to report this commit
        env:
          STATUS_URL: ${{ vars.STATUS_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          deadline=$((SECONDS + 900))
          while :; do
            live=$(curl -sf --max-time 10 "$STATUS_URL/api/status" | jq -r .version || true)
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "Live: $live"
              exit 0
            fi
            # A newer commit may be live already; it includes this one.
            if [[ $live =~ ^[0-9a-f]{40}$ ]] &&
              [ "$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$live" --jq .status 2>/dev/null)" = ahead ]; then
              echo "A newer commit is live: $live"
              exit 0
            fi
            if [ $SECONDS -ge $deadline ]; then
              echo "::error::After 15 minutes $STATUS_URL reports ${live:-nothing}, not $GITHUB_SHA. The rollout failed or is stuck: run 'flux get helmreleases -A' and check the pod."
              exit 1
            fi
            sleep 15
          done
